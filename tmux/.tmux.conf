# ---- General ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -sg escape-time 0          # no delay for escape key sequences (good for vim)
set -g base-index 1            # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ---- Prefix key: Ctrl-a instead of Ctrl-b (easier reach) ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Splits (more intuitive than % and ") ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows/panes open in current path
bind c new-window -c "#{pane_current_path}"

# ---- Pane navigation (vim-style) ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Reload config ----
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ---- Copy mode: vi keys ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Status bar (Atom Colorscheme - LazyVim-like) ----
set -g status-position bottom
set -g status-style bg=default,fg=#C5C8C6
set -g status-left-length 50
set -g status-right-length 80

# Left section: mode indicator + window
set -g status-left '#[fg=#222222,bg=#87C38A,bold] TMUX #[fg=#B9B6FC,bg=default] #[fg=#85BEFD]#S '

# Right section: window count + time
set -g status-right '#[fg=#8a8d90]|#[fg=#85BEFD] #{window_index}:#{pane_index} #[fg=#8a8d90]|#[fg=#B9B6FC,bold] %H:%M '

# Window format - current
setw -g window-status-current-style fg=#222222,bg=#B9B6FC,bold
setw -g window-status-current-format '#[bg=#B9B6FC,fg=#222222,bold] #I: #W '

# Window format - inactive
setw -g window-status-style fg=#8a8d90,bg=default
setw -g window-status-format '#[fg=#8a8d90] #I: #W '

# Separator between windows
set -g window-status-separator ''

# Pane borders
set -g pane-border-style fg=#383838
set -g pane-active-border-style fg=#85BEFD

# ---- Activity monitoring (useful for long-running k8s/psql jobs) ----
setw -g monitor-activity on
set -g visual-activity off

# -----------------------
# ---- Plugins (TPM) ----
# -----------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-resurrect: save/restore full sessions (panes, layouts, working dirs)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: auto-save every 15 min + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-yank: makes 'y' in copy-mode copy to system clipboard (not just tmux buffer)
set -g @yank_selection_mouse 'clipboard'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
